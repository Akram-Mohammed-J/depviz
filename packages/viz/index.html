<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dependency Graph Visualizer</title>
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: -apple-system, sans-serif; }
    #toolbar {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: #fff; border: 1px solid #ddd; border-radius: 6px;
      padding: 8px 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    #toolbar input { width: 320px; }
    #network { width: 100%; height: 100vh; }
    #sidebar {
      position: absolute; top: 12px; right: 12px; width: 320px; max-height: 80vh;
      overflow-y: auto; background: #fff; border: 1px solid #ddd; border-radius: 6px;
      padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); display: none; z-index: 10;
    }
    #sidebar h3 { margin-top: 0; }
    #sidebar .path { font-family: monospace; font-size: 12px; margin: 4px 0; }
    .legend { position: absolute; bottom: 12px; left: 12px; z-index: 10; font-size: 13px; background: #fff;
      border: 1px solid #ddd; border-radius: 6px; padding: 8px 12px; }
    .legend span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  </style>
</head>
<body>
  <div id="toolbar">
    <input id="jsonPath" placeholder="graph.json path or URL" value="graph.json" />
    <button id="loadBtn">Load</button>
  </div>
  <div id="network"></div>
  <div id="sidebar">
    <h3 id="sidebarTitle"></h3>
    <div id="sidebarVulns"></div>
    <div id="sidebarPaths"></div>
  </div>
  <div class="legend">
    <span style="background:#e74c3c"></span>Vulnerable &nbsp;
    <span style="background:#3498db"></span>Root dependency &nbsp;
    <span style="background:#95a5a6"></span>Transitive
  </div>
  <script src="main.js"></script>
</body>
</html>
